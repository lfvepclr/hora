<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f33;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Ocean background -->
  <rect width="1000" height="500" fill="url(#oceanGradient)"/>
  
  <!-- Simplified world map paths -->
  <g fill="#2d5a3d" stroke="#3d7a4d" stroke-width="0.5">
    <!-- North America -->
    <path d="M 50,80 L 150,60 L 200,80 L 220,150 L 180,200 L 120,220 L 80,180 L 60,120 Z"/>
    
    <!-- South America -->
    <path d="M 180,250 L 220,250 L 240,300 L 220,400 L 200,420 L 190,380 L 170,300 Z"/>
    
    <!-- Europe -->
    <path d="M 420,100 L 480,90 L 500,120 L 490,150 L 460,160 L 430,150 L 410,130 Z"/>
    
    <!-- Africa -->
    <path d="M 430,180 L 480,170 L 500,220 L 490,300 L 460,350 L 440,340 L 420,280 L 410,220 Z"/>
    
    <!-- Asia -->
    <path d="M 520,80 L 750,70 L 850,100 L 880,180 L 850,250 L 750,280 L 650,260 L 580,220 L 540,180 L 520,130 Z"/>
    
    <!-- Australia -->
    <path d="M 750,320 L 850,310 L 870,360 L 850,400 L 780,410 L 740,380 Z"/>
    
    <!-- Japan -->
    <path d="M 860,140 L 880,130 L 885,160 L 875,180 L 865,170 Z"/>
    
    <!-- UK -->
    <path d="M 400,110 L 415,105 L 420,125 L 410,135 L 395,125 Z"/>
    
    <!-- Greenland -->
    <path d="M 280,40 L 340,30 L 350,70 L 320,80 L 290,70 Z"/>
  </g>
  
  <!-- Major cities coordinates (for reference) -->
  <g fill="#ff6b35">
    <!-- Beijing -->
    <circle cx="750" cy="150" r="3"/>
    <!-- Tokyo -->
    <circle cx="860" cy="155" r="3"/>
    <!-- London -->
    <circle cx="430" cy="125" r="3"/>
    <!-- New York -->
    <circle cx="220" cy="140" r="3"/>
    <!-- Paris -->
    <circle cx="445" cy="130" r="3"/>
    <!-- Sydney -->
    <circle cx="820" cy="360" r="3"/>
    <!-- Dubai -->
    <circle cx="600" cy="200" r="3"/>
    <!-- Singapore -->
    <circle cx="720" cy="250" r="3"/>
  </g>
</svg>
